<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mizzty.lk - Buy Sell Find</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6f8;
  color:#222;
}

header{
  background:white;
  padding:15px 5%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 10px #0001;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#673ab7;
}

.post-btn{
  background:#673ab7;
  color:white;
  border:0;
  padding:11px 18px;
  border-radius:8px;
  font-weight:bold;
}

.hero{
  background:linear-gradient(135deg,#673ab7,#9c5cff);
  color:white;
  text-align:center;
  padding:55px 20px;
}

.hero h1{
  font-size:38px;
  margin-bottom:10px;
}

.hero p{
  margin-bottom:25px;
}

.search{
  max-width:650px;
  margin:auto;
  display:flex;
  background:white;
  padding:6px;
  border-radius:10px;
}

.search input{
  flex:1;
  border:0;
  outline:0;
  padding:14px;
  font-size:16px;
}

.search button{
  background:#673ab7;
  color:white;
  border:0;
  padding:0 20px;
  border-radius:7px;
}

.container{
  max-width:1100px;
  margin:35px auto;
  padding:0 20px;
}

h2{
  margin-bottom:20px;
}

.categories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:15px;
  margin-bottom:40px;
}

.category{
  background:white;
  padding:22px 10px;
  text-align:center;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
  cursor:pointer;
}

.icon{
  font-size:30px;
  margin-bottom:8px;
}

.ads{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.ad{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 8px #0001;
}

.ad-image{
  height:170px;
  background:#e7e7e7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  overflow:hidden;
}

.ad-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.ad-info{
  padding:15px;
}

.ad-info h3{
  margin-bottom:8px;
}

.price{
  color:#673ab7;
  font-weight:bold;
  font-size:18px;
  margin-bottom:7px;
}

.location{
  color:#777;
  font-size:14px;
}

footer{
  margin-top:50px;
  background:#222;
  color:white;
  text-align:center;
  padding:30px 15px;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:50;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  max-height:92vh;
  overflow:auto;
  border-radius:15px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.close{
  font-size:28px;
  border:0;
  background:none;
}

form label{
  display:block;
  margin:11px 0 6px;
  font-weight:bold;
}

form input,
form textarea,
form select{
  width:100%;
  padding:11px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:90px;
}

.submit{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:8px;
  background:#673ab7;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.note{
  color:#777;
  font-size:12px;
  margin-top:8px;
}

@media(max-width:600px){
  .hero h1{
    font-size:30px;
  }
}
</style>
</head>
